name: Refresh data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone AnyPS5 history
        run: git clone --filter=blob:none --no-checkout https://github.com/boykopovar/AnyPS5 "$RUNNER_TEMP/AnyPS5"
      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: scripts
        run: |
          python collect_prs.py
          python collect_community.py
          python progress_history.py --anyps5 "$RUNNER_TEMP/AnyPS5" --ref origin/main
          python build_dashboard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data standalone.html
          git diff --cached --quiet || git commit -m "chore(data): refresh $(date -u +%F)"
          git push
