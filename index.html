<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>AnyPS5 analytics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M7 23V12m6 11V8m6 15v-7m6 7V5' stroke='%23c5ac98' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <a class="brand" href="#overview"><strong>anyps5</strong><span>analytics</span></a>
    <nav class="section-tabs" id="tabs"></nav>
    <div class="header-meta">
      <span id="updated"></span>
      <button id="theme" type="button" aria-label="Toggle light and dark theme"></button>
    </div>
  </header>
  <div class="toolbar">
    <div class="pop-switch" id="range" role="group" aria-label="Date range"></div>
    <div class="pop-switch" id="evidence" role="group" aria-label="Attribution evidence"></div>
    <span class="toolbar-context" id="range-context"></span>
  </div>
  <main id="view"></main>
  <footer class="pop-note" id="footnote"></footer>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="data/dashboard.js"></script>
<script src="app.js"></script>
</body>
</html>
